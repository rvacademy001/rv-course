<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cinema Player | RV Academy HD Video Lessons</title>
  <link rel="icon" href="rvlogo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
</head>
<body>

  <div id="main-nav"></div>

  <main class="page-content">
    <div id="backend-notice"></div>

    <div class="row" style="margin-bottom:20px;">
      <div>
        <span class="badge badge-active" style="margin-bottom:8px;"><i class="fa-solid fa-film"></i> HD TRADING STREAM</span>
        <h1>Institutional Video Terminal</h1>
      </div>
      <div>
        <span class="badge"><i class="fa-solid fa-shield-halved text-bull"></i> DRM Screen Protected</span>
      </div>
    </div>

    <!-- Container for either Access Pending or Player -->
    <div id="lessons-view-container">
      <div class="card mu" style="text-align:center;padding:50px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;margin-bottom:12px;"></i>
        <p>Verifying DRM license &amp; student access permissions...</p>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script>
    let currentLesson = null;
    let currentUser = null;
    let allCourses = [];
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.I18N) window.I18N.apply();
      renderStudentNav("lessons");
      renderFooter();

      const me = requireAuth();
      if (!me) return;

      const users = await RV_DB.getUsers();
      currentUser = users.find(u => u.id === me.id) || me;
      allCourses = await RV_DB.getCourses();

      const container = document.getElementById("lessons-view-container");

      if (!currentUser.active && !currentUser.admin) {
        container.innerHTML = `
          <div class="card card-glowing-bear" style="padding:48px 32px;text-align:center;">
            <div style="font-size:3.5rem;color:var(--bear);margin-bottom:16px;">
              <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="color:var(--bear);margin-bottom:10px;">Video Lessons Access Locked</h2>
            <p class="mu" style="max-width:550px;margin:0 auto 24px;font-size:15px;line-height:1.7;">
              Your student profile has been registered, but requires admin activation upon payment verification. If you have already deposited your course fees, please send your receipt via WhatsApp.
            </p>
            <a href="contact.html" class="btn" style="padding:14px 28px;">
              <i class="fa-brands fa-whatsapp"></i> Contact Support for Instant Activation →
            </a>
          </div>
        `;
        return;
      }

      // Find first available lesson
      for (const c of allCourses) {
        for (const ch of (c.chapters || [])) {
          if (ch.lessons && ch.lessons.length > 0) {
            currentLesson = ch.lessons[0];
            break;
          }
        }
        if (currentLesson) break;
      }

      renderPlayerUI();
      setupSecurityProtections();
    });

    function renderPlayerUI() {
      const container = document.getElementById("lessons-view-container");

      const playerHtml = currentLesson ? `
        <div class="video-player-wrap" id="video-wrapper" oncontextmenu="return false">
          <iframe 
            src="https://drive.google.com/file/d/${escapeHtml(currentLesson.drive)}/preview" 
            sandbox="allow-scripts allow-same-origin" 
            allowfullscreen>
          </iframe>
          <div class="player-cover-blocker"></div>
          <div class="player-watermark" id="player-wm">
            <i class="fa-solid fa-shield"></i> ${escapeHtml(currentUser.email)}
          </div>
        </div>

        <div class="row" style="margin-top:18px;">
          <div>
            <h2 style="margin-bottom:4px;font-size:1.6rem;">${escapeHtml(currentLesson.title)}</h2>
            <span class="badge badge-active"><i class="fa-solid fa-circle-play"></i> Now Playing in Full HD 1080p</span>
          </div>
        </div>
      ` : `
        <div class="card mu" style="text-align:center;padding:60px;">
          <i class="fa-solid fa-circle-exclamation" style="font-size:32px;color:var(--gold);margin-bottom:12px;"></i>
          <h3>No Lessons Found</h3>
          <p>Please check back soon as lessons are being prepared by the mentors.</p>
        </div>
      `;

      const curriculumHtml = allCourses.map(c => `
        <div class="card" style="margin-bottom:16px;padding:20px;">
          <h3 style="font-size:1.15rem;margin-bottom:14px;color:var(--bull);display:flex;align-items:center;gap:8px;">
            <i class="fa-solid fa-graduation-cap"></i> ${escapeHtml(c.title)}
          </h3>

          ${(c.chapters || []).map(ch => `
            <div style="margin-bottom:14px;">
              <span class="mu" style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);display:block;margin-bottom:6px;">
                ${escapeHtml(ch.title)}
              </span>

              <div class="lesson-list">
                ${(ch.lessons || []).map(l => `
                  <div class="lesson-item ${currentLesson && currentLesson.id === l.id ? 'active' : ''}" 
                       onclick="switchLesson('${l.id}', '${escapeHtml(l.title).replace(/'/g, "\\'")}', '${l.drive}')">
                    <span style="display:flex;align-items:center;gap:8px;">
                      <i class="fa-solid ${currentLesson && currentLesson.id === l.id ? 'fa-circle-play text-bull' : 'fa-play'}"></i> 
                      ${escapeHtml(l.title)}
                    </span>
                    <span class="badge" style="font-size:10px;">HD</span>
                  </div>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `).join("");

      container.innerHTML = `
        <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 28px;">
          <div>${playerHtml}</div>
          <div>
            <h3 style="margin-bottom:16px;display:flex;align-items:center;gap:8px;">
              <i class="fa-solid fa-list-check text-bull"></i> Course Playlist
            </h3>
            ${curriculumHtml}
          </div>
        </div>
      `;

      initWatermarkAnimation();
    }

    function switchLesson(id, title, drive) {
      currentLesson = { id, title, drive };
      renderPlayerUI();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function initWatermarkAnimation() {
      const wm = document.getElementById("player-wm");
      if (!wm) return;
      setInterval(() => {
        if (!document.getElementById("player-wm")) return;
        const randX = Math.floor(Math.random() * 60);
        const randY = Math.floor(Math.random() * 70);
        wm.style.left = randX + "%";
        wm.style.top = randY + "%";
      }, 3500);
    }

    function setupSecurityProtections() {
      const getWrap = () => document.getElementById("video-wrapper");

      window.addEventListener("blur", () => {
        const wrap = getWrap();
        if (wrap) wrap.classList.add("blur-protection");
      });

      window.addEventListener("focus", () => {
        const wrap = getWrap();
        if (wrap) wrap.classList.remove("blur-protection");
      });

      document.addEventListener("visibilitychange", () => {
        const wrap = getWrap();
        if (wrap) {
          if (document.hidden) wrap.classList.add("blur-protection");
          else wrap.classList.remove("blur-protection");
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.key === "PrintScreen") {
          try {
            navigator.clipboard.writeText("");
            showToast("Screen captures are blocked to protect intellectual property.", "error");
          } catch (err) {}
        }
      });
    }
  </script>
</body>
</html>
