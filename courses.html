<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Courses &amp; Curriculum | RV Academy</title>
  <link rel="icon" href="rvlogo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
</head>
<body>

  <div id="main-nav"></div>

  <main class="page-content">
    <div id="backend-notice"></div>

    <div style="text-align:center;margin:10px 0 36px;">
      <span class="badge badge-active" style="margin-bottom:10px;">
        <i class="fa-solid fa-graduation-cap"></i> INSTITUTIONAL SYLLABUS
      </span>
      <h1 data-si="ප්‍රවීණ Trading පාඨමාලා (Course Catalog)" data-en="Institutional Trading Curriculum">
        ප්‍රවීණ Trading පාඨමාලා (Course Catalog)
      </h1>
      <p class="mu" style="max-width:650px;margin:8px auto 0;" data-si="නියම Price Action, Smart Money Concepts (SMC) සහ Risk Management මුල සිට සරලව ඉගෙන ගන්න." data-en="Master real institutional order flow, SMC frameworks, and risk architecture.">
        නියම Price Action, Smart Money Concepts (SMC) සහ Risk Management මුල සිට සරලව ඉගෙන ගන්න.
      </p>
    </div>

    <div id="course-container">
      <div class="card mu" style="text-align:center;padding:50px;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;margin-bottom:12px;"></i>
        <p>Loading course syllabus...</p>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.I18N) window.I18N.apply();
      renderNav("courses");
      renderFooter();
      renderBackendBanner("backend-notice");

      const container = document.getElementById("course-container");
      const me = RV_Auth.getMe();
      const lang = window.I18N ? window.I18N.currentLang : "si";

      try {
        const courses = await RV_DB.getCourses();
        if (!courses || courses.length === 0) {
          container.innerHTML = `<div class="card mu">No courses published yet.</div>`;
          return;
        }

        container.innerHTML = courses.map(c => {
          const totalLessons = (c.chapters || []).reduce((acc, ch) => acc + (ch.lessons ? ch.lessons.length : 0), 0);

          return `
            <div class="card card-glowing-bull" style="margin-bottom:36px;padding:32px;">
              <div class="row" style="margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:20px;">
                <div>
                  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                    <span class="badge badge-active"><i class="fa-solid fa-bolt"></i> Institutional Masterclass</span>
                    <span class="badge"><i class="fa-solid fa-video"></i> ${totalLessons} HD Video Lessons</span>
                  </div>
                  <h2 style="font-size:2rem;margin-bottom:6px;">${escapeHtml(c.title)}</h2>
                  <div style="font-family:var(--font-heading);font-size:1.8rem;font-weight:900;color:var(--bull);">
                    ${escapeHtml(c.price || 'Rs. 25,000')}
                  </div>
                </div>

                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                  <a href="payment.html?course=${c.id}" class="btn" style="padding:14px 26px;">
                    <i class="fa-solid fa-credit-card"></i>
                    ${lang === 'si' ? 'Register &amp; Payment කරන්න →' : 'Enroll &amp; Pay Now →'}
                  </a>
                  ${me && me.active ? `
                    <a href="lessons.html" class="btn btn-sec" style="padding:14px 20px;">
                      <i class="fa-solid fa-play"></i> Watch Lessons
                    </a>
                  ` : ''}
                </div>
              </div>

              <p class="mu" style="font-size:15px;margin-bottom:24px;line-height:1.7;">
                ${escapeHtml(c.desc || "")}
              </p>

              ${c.details ? `
                <div style="background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:28px;">
                  <strong style="display:block;margin-bottom:10px;color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;">
                    <i class="fa-solid fa-clipboard-check text-bull"></i> ${lang === 'si' ? 'පාඨමාලා විෂය නිර්දේශය (Syllabus Highlights):' : 'Course Syllabus &amp; Learning Outcomes:'}
                  </strong>
                  <pre style="font-size:14px;line-height:1.8;">${escapeHtml(c.details)}</pre>
                </div>
              ` : ''}

              <h3 style="margin-bottom:16px;display:flex;align-items:center;gap:10px;">
                <i class="fa-solid fa-bars-staggered text-bull"></i> ${lang === 'si' ? 'පාඩම් මාලාව (Curriculum Chapters)' : 'Detailed Chapters &amp; Lessons'}
              </h3>

              <div style="display:flex;flex-direction:column;gap:14px;">
                ${(c.chapters || []).map((ch, idx) => `
                  <div style="background:var(--bg-card-hover);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px;">
                    <div class="row">
                      <strong style="color:#fff;font-size:15px;">
                        <span style="color:var(--bull);font-family:var(--font-mono);margin-right:8px;">${idx + 1 < 10 ? '0' + (idx + 1) : idx + 1}.</span> 
                        ${escapeHtml(ch.title)}
                      </strong>
                      <span class="badge">${(ch.lessons || []).length} lessons</span>
                    </div>

                    ${ch.lessons && ch.lessons.length > 0 ? `
                      <div class="lesson-list" style="margin-top:14px;">
                        ${ch.lessons.map(l => `
                          <div class="lesson-item" style="cursor:default;">
                            <span><i class="fa-solid fa-play text-bull" style="font-size:11px;margin-right:8px;"></i> ${escapeHtml(l.title)}</span>
                            <span class="badge" style="font-size:10px;"><i class="fa-solid fa-lock"></i> Members Only</span>
                          </div>
                        `).join("")}
                      </div>
                    ` : '<p class="mu" style="font-size:12px;margin-top:8px;">Lessons will be unlocked upon enrollment.</p>'}
                  </div>
                `).join("")}
              </div>

              <!-- Quick Enroll CTA Bar -->
              <div style="margin-top:28px;text-align:center;background:rgba(0,240,118,0.06);border:1px solid rgba(0,240,118,0.25);border-radius:var(--radius-md);padding:20px;">
                <h4 style="margin-bottom:6px;color:#fff;">
                  ${lang === 'si' ? 'මෙම පාඨමාලාවට සම්බන්ධ වීමට සූදානම්ද?' : 'Ready To Join This Course?'}
                </h4>
                <p class="mu" style="font-size:13px;margin-bottom:14px;">
                  ${lang === 'si' ? 'Bank Transfer, Binance Pay (USDT) හෝ Skrill මගින් ගෙවා දැන්ම සම්බන්ධ වන්න.' : 'Pay via Bank Transfer, Binance Pay (USDT) or Skrill.'}
                </p>
                <a href="payment.html?course=${c.id}" class="btn">
                  <i class="fa-solid fa-arrow-right"></i> ${lang === 'si' ? 'Register &amp; Make Payment' : 'Enroll &amp; Pay Now'}
                </a>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
