<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login | RV Academy</title>
  <link rel="icon" href="rvlogo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
</head>
<body>

  <div id="main-nav"></div>

  <main class="page-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;min-height:70vh;">
    
    <div class="card card-glowing-bull" style="max-width:440px;width:100%;padding:40px 32px;box-shadow:0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(0,240,118,0.12);">
      
      <!-- Brand Logo Centerpiece -->
      <div style="text-align:center;margin-bottom:28px;">
        <div class="brand-logo-wrap" style="display:inline-block;margin-bottom:14px;">
          <img src="rvlogo.jpg" alt="RV Academy Logo" style="height:70px;width:70px;border-radius:14px;border:2px solid rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.8);">
        </div>
        <h2 id="form-heading" style="font-size:1.8rem;margin-bottom:6px;" data-si="පිවිසෙන්න" data-en="Login">
          පිවිසෙන්න
        </h2>
        <p class="mu" style="font-size:13px;" data-si="ඔබගේ Username හෝ Email සහ Password ඇතුළත් කර පිවිසෙන්න." data-en="Enter your username or email and password to log in.">
          ඔබගේ Username හෝ Email සහ Password ඇතුළත් කර පිවිසෙන්න.
        </p>
      </div>

      <!-- Login Form -->
      <form onsubmit="handleLogin(event)">
        <label for="l-username"><i class="fa-solid fa-user"></i> Username or Email</label>
        <input type="text" id="l-username" placeholder="Username or email address" required autocomplete="username">

        <label for="l-pw"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="l-pw" placeholder="Enter your password" required autocomplete="current-password">

        <div style="margin-top:24px;">
          <button type="submit" class="btn" id="login-submit-btn" style="width:100%;padding:14px;font-size:14px;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
          </button>
        </div>
      </form>

      <!-- New Student Registration Callout -->
      <div style="margin-top:28px;text-align:center;border-top:1px solid var(--border);padding-top:20px;">
        <p class="mu" style="font-size:13px;line-height:1.6;" data-si="අලුතින් සම්බන්ධ වීමට අවශ්‍ය නම්, කරුණාකර පාඨමාලාවකට ලියාපදිංචි වී Payment එක සම්පූර්ණ කරන්න." data-en="Want to enroll? Please register for a course and complete the payment.">
          අලුතින් සම්බන්ධ වීමට අවශ්‍ය නම්, කරුණාකර පාඨමාලාවකට ලියාපදිංචි වී Payment එක සම්පූර්ණ කරන්න.
        </p>
        <a href="courses.html" class="btn btn-sm btn-sec" style="margin-top:10px;display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-graduation-cap text-bull"></i> පාඨමාලා බලන්න &amp; Register වන්න →
        </a>
      </div>

    </div>
  </main>

  <div id="main-footer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.I18N) window.I18N.apply();
      renderNav("login");
      renderFooter();
      redirectIfLoggedIn();
    });

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const username = document.getElementById("l-username").value.trim();
      const pw = document.getElementById("l-pw").value.trim();

      if (!username || !pw) {
        showToast("Please enter both username and password.", "error");
        return;
      }

      const btn = document.getElementById("login-submit-btn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

      try {
        const user = await RV_DB.login(username, pw);
        RV_Auth.setMe(user);

        showToast("Authentication successful! Redirecting...", "success");

        setTimeout(() => {
          if (user.admin) {
            window.location.href = "admin.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> Login`;
        showToast(err.message || "Invalid credentials! Please try again.", "error");
      }
    }
  </script>
</body>
</html>
