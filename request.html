<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lesson Requests | RV Academy</title>
  <link rel="icon" href="rvlogo.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/shared.js"></script>
</head>
<body>

  <div id="main-nav"></div>

  <main class="page-content">
    <div id="backend-notice"></div>

    <div style="margin-bottom:28px;">
      <span class="badge badge-active" style="margin-bottom:8px;">STUDENT MENTORSHIP</span>
      <h1>Request a Custom Video Breakdown</h1>
      <p class="mu">Struggling with a specific trade setup, London Killzone entry, or market pattern? Tell your mentors, and we will record a dedicated video lesson.</p>
    </div>

    <!-- Request Form Card -->
    <div class="card card-glowing-bull" style="margin-bottom:36px;padding:32px;">
      <h3 style="margin-bottom:14px;display:flex;align-items:center;gap:10px;">
        <i class="fa-solid fa-pen-to-square text-bull"></i> Submit New Topic Request
      </h3>
      <label><i class="fa-solid fa-align-left"></i> Topic Details &amp; Questions</label>
      <textarea id="req-text" rows="4" placeholder="e.g. Please analyze Gold (XAU/USD) 15-minute FVG entries during the New York Open..."></textarea>
      
      <button type="button" class="btn" style="margin-top:16px;padding:12px 26px;" onclick="handleSendRequest()">
        <i class="fa-solid fa-paper-plane"></i> Submit Lesson Request to Mentors
      </button>
    </div>

    <h2 style="margin-bottom:18px;">Your Submitted Requests</h2>
    <div id="requests-history">
      <div class="card mu" style="text-align:center;padding:40px;">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading request history...
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      if (window.I18N) window.I18N.apply();
      renderStudentNav("request");
      renderFooter();

      currentUser = requireAuth();
      if (!currentUser) return;

      loadRequestsHistory();
    });

    async function loadRequestsHistory() {
      const historyContainer = document.getElementById("requests-history");
      try {
        const allReqs = await RV_DB.getRequests();
        const userReqs = allReqs.filter(r => r.uid === currentUser.id);

        if (!userReqs || userReqs.length === 0) {
          historyContainer.innerHTML = `
            <div class="card mu" style="text-align:center;padding:40px;">
              <i class="fa-solid fa-inbox" style="font-size:28px;margin-bottom:10px;display:block;"></i>
              You have not submitted any lesson requests yet.
            </div>
          `;
          return;
        }

        historyContainer.innerHTML = userReqs.map(r => `
          <div class="card" style="margin-bottom:14px;padding:20px;">
            <div class="row" style="margin-bottom:10px;">
              <span class="badge badge-active"><i class="fa-solid fa-check"></i> Submitted</span>
              <span class="mu" style="font-size:12px;"><i class="fa-regular fa-calendar"></i> ${escapeHtml(r.date || "")}</span>
            </div>
            <p style="white-space:pre-wrap;color:#f8fafc;font-size:14px;line-height:1.7;">${escapeHtml(r.text)}</p>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
      }
    }

    async function handleSendRequest() {
      const text = document.getElementById("req-text").value.trim();
      if (!text) {
        showToast("Please describe the topic you want to request.", "error");
        return;
      }

      try {
        await RV_DB.addRequest(currentUser.id, currentUser.name, text);
        document.getElementById("req-text").value = "";
        showToast("Lesson request sent to mentors!", "success");
        loadRequestsHistory();
      } catch (e) {
        showToast("Failed to submit request: " + e.message, "error");
      }
    }
  </script>
</body>
</html>
